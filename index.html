<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Digital Signage Receiver</title>
  <!-- Google Cast Receiver SDK -->
  <script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #0f172a;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #slide-container {
      width: 90vw;
      max-width: 1400px;
      min-height: 70vh;
      background: #1e293b;
      border-radius: 24px;
      padding: 3.5rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.08);
      opacity: 1;
      transition: opacity 0.8s ease-in-out;
    }
    #tag {
      font-size: 1.1rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #38bdf8;
      margin-bottom: 1rem;
    }
    #title {
      font-size: 2.75rem;
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 1rem;
      color: #ffffff;
    }
    #image {
      max-width: 70vw;
      max-height: 42vh;
      width: auto;
      height: auto;
      border-radius: 16px;
      margin-top: 1rem;
      margin-bottom: 1.5rem;
      display: none;
      object-fit: contain;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }
    #message {
      font-size: 1.5rem;
      line-height: 1.6;
      color: #cbd5e1;
      max-width: 85%;
      margin-bottom: 1.5rem;
      white-space: pre-wrap;
    }
    #date {
      font-size: 1.1rem;
      font-weight: 500;
      color: #64748b;
    }
  </style>
</head>
<body>

  <!-- Hidden audio loop ensures hardware media pipeline stays active on all Chromecast models -->
  <audio loop autoplay muted playsinline src="https://raw.githubusercontent.com/anars/blank-audio/master/10-minutes-of-silence.mp3"></audio>

  <div id="slide-container">
    <div id="tag">Announcements</div>
    <h1 id="title">Loading Display...</h1>
    <img id="image" src="" alt="Announcement Graphic">
    <p id="message">Connecting to live feed...</p>
    <div id="date"></div>
  </div>

  <script>
    // ==========================================
    // 1. CONFIGURE YOUR APPS SCRIPT API URL HERE
    // ==========================================
    const API_URL = "https://script.google.com/macros/s/AKfycby1uU6V7ciGX8xuNkTWinwhsEbIxVqMUHqFqh7pXTB01zTa3GMLe22z5PaR0yZCDreQvg/exec";

    const SLIDE_DURATION_MS = 8000;   // 8 seconds per slide
    const SYNC_INTERVAL_MS = 180000;  // Refresh from Google Sheets every 3 minutes

    let announcements = [];
    let currentIndex = 0;
    let slideTimer = null;

    // ==========================================
    // 2. INITIALIZE CAST RECEIVER (24/7 KEEP-ALIVE)
    // ==========================================
    const context = cast.framework.CastReceiverContext.getInstance();
    const options = new cast.framework.CastReceiverOptions();

    options.disableIdleTimeout = true;
    options.maxInactivity = 86400 * 365;

    context.start(options);

    // Heartbeat ping to prevent system sleep
    setInterval(() => {
      try {
        context.setSystemVolumeLevel(context.getSystemVolumeLevel());
      } catch (e) {
        // Ignore heartbeat error
      }
    }, 30000);

    // ==========================================
    // 3. FETCH DATA FROM GOOGLE SHEETS API
    // ==========================================
    async function fetchAnnouncements() {
      try {
        const response = await fetch(API_URL);
        const data = await response.json();
        
        if (Array.isArray(data) && data.length > 0) {
          announcements = data;
          
          // Start the rotation loop if it isn't already running
          if (!slideTimer) {
            renderNextSlide();
            slideTimer = setInterval(renderNextSlide, SLIDE_DURATION_MS);
          }
        } else {
          showFallback("No Active Announcements", "Check back soon for upcoming updates.");
        }
      } catch (err) {
        console.error("Feed fetch error:", err);
        if (announcements.length === 0) {
          showFallback("Connecting...", "Fetching latest announcements from server.");
        }
      }
    }

    // ==========================================
    // 4. RENDER & CYCLE SLIDES SAFELY
    // ==========================================
    function renderNextSlide() {
      if (announcements.length === 0) return;

      const container = document.getElementById("slide-container");
      const titleEl = document.getElementById("title");
      const messageEl = document.getElementById("message");
      const imageEl = document.getElementById("image");
      const dateEl = document.getElementById("date");

      // Smooth fade out
      container.style.opacity = "0";

      setTimeout(() => {
        const item = announcements[currentIndex];

        // 1. Text Content
        titleEl.innerHTML = item.title || "";
        titleEl.style.display = item.title ? "block" : "none";

        messageEl.innerHTML = item.message || "";
        messageEl.style.display = item.message ? "block" : "none";

        // 2. Safe Image Handling
        let rawUrl = item.imageUrl ? item.imageUrl.trim() : "";
        
        // Auto-convert standard Dropbox links to direct raw image URLs
        if (rawUrl.includes("dropbox.com")) {
          rawUrl = rawUrl.replace(/([?&])dl=[01]/, "$1raw=1");
          if (!rawUrl.includes("raw=1")) {
            rawUrl += (rawUrl.includes("?") ? "&" : "?") + "raw=1";
          }
        }

        // Filter out non-image links (like canva.link web pages)
        if (rawUrl !== "" && !rawUrl.includes("canva.link")) {
          imageEl.onerror = function() {
            console.warn("Image failed to load:", rawUrl);
            imageEl.style.display = "none";
          };
          imageEl.src = rawUrl;
          imageEl.style.display = "block";
        } else {
          imageEl.style.display = "none";
          imageEl.src = "";
        }

        // If slide only contains an image and no text, clean up margins
        if (!item.title && !item.message && imageEl.style.display === "block") {
          imageEl.style.maxHeight = "58vh";
        } else {
          imageEl.style.maxHeight = "42vh";
        }

        // 3. Date Formatting
        if (item.date && String(item.date).trim() !== "") {
          const parsedDate = new Date(item.date);
          if (!isNaN(parsedDate.getTime())) {
            dateEl.innerText = parsedDate.toLocaleDateString("en-US", {
              year: "numeric",
              month: "long",
              day: "numeric"
            });
          } else {
            dateEl.innerText = item.date;
          }
          dateEl.style.display = "block";
        } else {
          dateEl.innerText = "";
          dateEl.style.display = "none";
        }

        // Smooth fade in
        container.style.opacity = "1";

        // Advance index
        currentIndex = (currentIndex + 1) % announcements.length;
      }, 800);
    }

    function showFallback(title, message) {
      const container = document.getElementById("slide-container");
      document.getElementById("title").innerText = title;
      document.getElementById("title").style.display = "block";
      document.getElementById("message").innerText = message;
      document.getElementById("message").style.display = "block";
      document.getElementById("image").style.display = "none";
      document.getElementById("date").innerText = "";
      container.style.opacity = "1";
    }

    // Initial fetch and continuous background sync
    fetchAnnouncements();
    setInterval(fetchAnnouncements, SYNC_INTERVAL_MS);
  </script>
</body>
</html>
